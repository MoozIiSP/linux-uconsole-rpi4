name: Build Kernel for uConsole
run-name: ${{ github.actor }} is building uConsole CM4 Kernel 🚀

on:
  push:
    branches: [rpi-6.1.y, rpi-6.6.y, rpi-*.y]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build 🚀
    runs-on: ubuntu-latest
    container:
      image: manjarolinux/build
    timeout-minutes: 240
    outputs:
      pkg_version: ${{ steps.version.outputs.version }}
      pkg_file: ${{ steps.version.outputs.file }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          pacman-mirrors -c China -m rank
          pacman -Syy --noconfirm docbook-xml libxslt bc docbook-xsl inetutils xmlto

      - name: Build linux-clockworkpi-uc4
        run: |
          cd PKGBUILDs/linux-clockworkpi-uc4
          cp -r ./* /builder/
          chown -R builder:builder /builder
          su - builder -c "cd /builder && makepkg -s --noconfirm"
          cp /builder/*.pkg.tar.zst "${GITHUB_WORKSPACE}/PKGBUILDs/linux-clockworkpi-uc4/" 2>/dev/null || true

      - name: Extract version info
        id: version
        run: |
          cd PKGBUILDs/linux-clockworkpi-uc4
          PKG_FILE=$(ls *.pkg.tar.* 2>/dev/null | head -1)
          PKG_VER=$(echo "$PKG_FILE" | grep -oP '(?<=linux-clockworkpi-uc4-).*(?=\.pkg\.tar)')
          echo "version=${PKG_VER:-${{ github.sha }}}" >> $GITHUB_OUTPUT
          echo "file=${PKG_FILE}" >> $GITHUB_OUTPUT

      - name: Upload kernel package (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: linux-clockworkpi-uc4
          path: PKGBUILDs/linux-clockworkpi-uc4/*.pkg.tar.*
          retention-days: 30

      - name: Create GitHub Release
        if: always() && !cancelled()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: uConsole Kernel ${{ steps.version.outputs.version }}
          body: |
            ## uConsole CM4 Kernel Build — Pre-release
            ### 📦 Key Features
            - **AXP228 PMIC Support**: Battery energy reporting via `(percentage * capacity) / 100`, safe IPSOUT current configuration, charge LED control, and calibration sysfs interface.
            - **JD9365D Panel Driver**: Clockworkpi CWU50 display support with DSI error status exposure.
            - **OCP8178 Backlight**: I2C backlight control driver for uConsole screen brightness.
            - **Clean DTS Overlays**: Removed accidental netfilter pollution, pure device tree overlay for CM4.
            ### ⚠️ Notes
            - IPSOUT current set to conservative 1200mA (`0x03`). May need adjustment to `0x07` (2000mA) if 4G module causes power drops under load.
            - Suspend/Wake support planned for next iteration.
            - Built from branch: `${{ github.ref_name }}`
          files: PKGBUILDs/linux-clockworkpi-uc4/*.pkg.tar.*
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Create System Image 📀
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:latest
          platforms: arm64

      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Download kernel package
        uses: actions/download-artifact@v4
        with:
          name: linux-clockworkpi-uc4
          path: ./kernel-pkg

      - name: Build Manjaro ARM Image
        run: |
          chmod +x scripts/build-image.sh
          docker run --rm --privileged \
            -v ${{ github.workspace }}:/workspace \
            -v /proc/sys/fs/binfmt_misc:/proc/sys/fs/binfmt_misc \
            -e GITHUB_WORKSPACE=/workspace \
            manjarolinux/build \
            bash -c "cd /workspace && scripts/build-image.sh ./kernel-pkg ./release"

      - name: Upload Image to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.build.outputs.pkg_version) }}
          files: ./release/*.img.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Image (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: manjaro-arm-uconsole-cm4
          path: ./release/*.img.xz
          retention-days: 30
