name: Build Kernel for uConsole
run-name: ${{ github.actor }} is building uConsole CM4 Kernel 🚀

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build 🚀
    runs-on: self-hosted
    container:
      image: manjarolinux/build
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          pacman-mirrors -c China -m rank
          pacman -Syy --noconfirm docbook-xml libxslt bc docbook-xsl inetutils xmlto

      - name: Build linux-clockworkpi-uc4
        run: |
          cd PKGBUILDs/linux-clockworkpi-uc4
          cp -r ./* /builder/
          chown -R builder:builder /builder
          su - builder -c "cd /builder && makepkg -s --noconfirm"
          cp /builder/*.pkg.tar.* ./

      - name: Upload kernel package
        uses: actions/upload-artifact@v4
        with:
          name: linux-clockworkpi-uc4
          path: PKGBUILDs/linux-clockworkpi-uc4/*.pkg.tar.*
